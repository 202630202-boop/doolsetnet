<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>저녁 메뉴 추천</title>
</head>
<body>

    <h1>오늘 저녁 메뉴 추천</h1>
    <h2 id="menu">버튼을 눌러주세요</h2>
    <button onclick="recommend()">메뉴 추천받기</button>

    <script>
        const menus = ["삼겹살", "치킨", "초밥", "김치찌개", "떡볶이", "파스타", "족발", "햄버거", "짜장면", "마라탕"];

        function recommend() {
            const randomIndex = Math.floor(Math.random() * menus.length);
            document.getElementById("menu").innerText = menus[randomIndex];
        }
    </script>

</body>
</html>
